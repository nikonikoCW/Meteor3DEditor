<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Meteor3D 场景加载示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="canvas"></div>
    <div style="position: fixed; top: 20px; left: 20px; z-index: 100; display: flex; gap: 10px;">
        <button onclick="testGetViewCallback()">获取视角 (Callback)</button>
        <button onclick="testGetViewAwait()">获取视角 (Await)</button>
        <button onclick="testSetView()">恢复视角 (Animation)</button>
    </div>

    <script src="./dist/meteor3d-core.umd.js"></script>
    <script>
        // ========== 测试 scene-ready 事件监听 ==========
        const container = document.getElementById('canvas');

        console.log('⏳ 开始加载场景...');
        const startTime = performance.now();

        Meteor3D.loadScene({
            sceneId: '8c56a55f-9211-49e8-8442-835b50c7f67e',
            serverUrl: 'http://localhost:3001',
            container: container,
            config: {
                dracoPath: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/'
            }
        }).then(instance => {
            const loadTime = (performance.now() - startTime).toFixed(0);
            console.log(`✅ 场景加载成功 (耗时 ${loadTime}ms)`);
            window.meteor3d = instance;

            // ========== 测试 isReady 状态 ==========
            console.log('📌 instance.isReady =', instance.isReady);  // 应该是 true

            // ========== 测试事件监听 ==========
            // 注意: loadScene 返回时场景已就绪，此时订阅 scene-ready 会错过事件
            // 这个订阅主要用于后续动态切换场景的场景
            instance.on('scene-ready', (data) => {
                console.log('🎉 [事件] scene-ready 被触发:', data);
            });

            // ========== 可用 API 列表 ==========
            // 基础状态与事件:
            // instance.isReady                       - 场景是否就绪
            // instance.on(event, callback)           - 订阅事件
            // instance.off(event, callback)          - 取消订阅

            // 性能监控:
            // instance.enableStats() / disableStats() / toggleStats(bool)

            // 三角形统计:
            // instance.toggleTriangleStats(bool, callback)

            // 相机控制:
            // instance.fitCameraToScene()
            // instance.resize(width, height)

            // GIS 坐标:
            // instance.lngLatToWorld(lng, lat, height)
            // instance.worldToLngLat(worldPos)

            // 辅助显示:
            // instance.setGridHelper(visible, length, width)

            // 标签 API:
            // instance.createLabel({ position, content, style })
            // instance.getLabels()
            // instance.clearLabels()

            // 生命周期:
            // instance.dispose()

            // 高级用法（不推荐）:
            // instance._internal.sceneManager / scene / camera / renderer

        }).catch(err => {
            console.error('❌ 加载失败', err);
        });

        // ========== 测试逻辑 ==========
        let savedView = null;

        function testGetViewCallback() {
            if (!window.meteor3d) return;
            window.meteor3d.getView((view) => {
                console.log('📍 [Callback] 获取到视角:', view);
                savedView = view;
                alert('视角已保存 (Callback)');
            });
        }

        async function testGetViewAwait() {
            if (!window.meteor3d) return;
            const view = await window.meteor3d.getView();
            console.log('📍 [Await] 获取到视角:', view);
            savedView = view;
            alert('视角已保存 (Await)');
        }

        async function testSetView() {
            if (!window.meteor3d || !savedView) {
                alert('请先保存视角！');
                return;
            }
            console.log('✈️ 开始飞行...');
            const a = await window.meteor3d.setView({
                position: savedView.position,
                target: savedView.target,
                duration: 2000
            })
            console.log('✈️ 飞行完成:', a);
            alert('飞行完成！');
        }
    </script>
</body>

</html>
