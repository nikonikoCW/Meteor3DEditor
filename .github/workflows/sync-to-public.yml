name: Sync to Public Repo

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove private packages
        run: |
          rm -rf packages/dashboard
          rm -rf packages/app-editor
          
          # 更新 pnpm-workspace.yaml
          cat > pnpm-workspace.yaml << 'EOF'
          packages:
            - 'packages/*'
            - 'meteor3d-server'
          EOF
          
          # 移除 package.json 中闭源包相关脚本
          if [ -f package.json ]; then
            sed -i '/"dev:dashboard"/d' package.json
            sed -i '/"dev:app"/d' package.json
            sed -i '/"build:dashboard"/d' package.json
            sed -i '/"build:app"/d' package.json
          fi
          
          # 移除 .github 目录 (不需要同步 workflow)
          rm -rf .github

      - name: Push to public repo
        run: |
          git config user.name "nikonikoCW"
          git config user.email "84675738@qq.com"
          
          git add -A
          git commit -m "Sync from private repo" --allow-empty
          
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/nikonikoCW/Meteor3DEditor.git
          git push public HEAD:master --force
