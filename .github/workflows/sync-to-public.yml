name: Sync to Public Repo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: Remove private packages
        run: |
          rm -rf packages/dashboard
          rm -rf packages/app-editor
          rm -rf packages/docs
          rm -rf packages/core-webgpu
          rm -rf packages/scene-editor-webgpu
          
          # 删除所有 .md 文件 (但保留根目录 README.md)
          find . -name "*.md" -type f ! -name "README.md" -delete
          
          # 删除 plan 目录 (如果有的话)
          rm -rf plan
          
          # 更新 pnpm-workspace.yaml
          cat > pnpm-workspace.yaml << 'EOF'
          packages:
            - 'packages/*'
            - 'meteor3d-server'
          EOF
          
          # 移除 package.json 中闭源包相关脚本
          if [ -f package.json ]; then
            sed -i '/"dev:dashboard"/d' package.json
            sed -i '/"dev:app"/d' package.json
            sed -i '/"build:dashboard"/d' package.json
            sed -i '/"build:app"/d' package.json
          fi
          
          # 移除 .github 目录
          rm -rf .github

      - name: Push to public repos
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_REPO_TOKEN }}
        run: |
          git config user.name "nikonikoCW"
          git config user.email "84675738@qq.com"
          
          git add -A
          git commit -m "Sync from private repo" --allow-empty
          
          # 1. Push to GitHub
          # 删除原来的 origin 然后添加 public remote
          git remote remove origin
          git remote add origin https://nikonikoCW:${GITHUB_TOKEN}@github.com/nikonikoCW/Meteor3DEditor.git
          echo "Pushing to GitHub..."
          git push origin HEAD:master --force
          
          # 2. Push to Gitee
          # 修改 origin 为 Gitee 地址
          git remote set-url origin https://CWniconico:${GITEE_TOKEN}@gitee.com/CWniconico/Meteor3DEditor.git
          echo "Pushing to Gitee..."
          git push origin HEAD:master --force
