name: Sync to Public Repos

on:
  push:
    branches: [master]
  workflow_dispatch:

# The workflow only needs to read the private source repository. Cross-repository
# pushes use the dedicated tokens configured in repository secrets.
permissions:
  contents: read

# Prevent two public force-push operations from running at the same time.
concurrency:
  group: sync-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: private-source

      - name: Build sanitized public snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir public-dist
          # Export tracked files only. git archive never includes the source .git directory.
          git -C private-source archive --format=tar HEAD | tar -xf - -C public-dist
          cd public-dist

          # Remove private packages and files.
          rm -rf packages/dashboard
          rm -rf packages/app-editor
          rm -rf packages/docs
          rm -rf packages/core-webgpu
          rm -rf packages/scene-editor-webgpu
          rm -rf packages/ai-scene
          rm -f packages/core/dashboard.html

          # Remove every Markdown file except the root README.md.
          find . -type f -name '*.md' ! -path './README.md' -delete

          rm -rf plan
          rm -f meteor3d-server/.env
          rm -f meteor3d-server/.env.example

          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - 'packages/*'
            - 'meteor3d-server'
          EOF

          # Remove scripts that reference packages excluded from the public snapshot.
          node <<'NODE'
          const fs = require('fs');
          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const privateScripts = [
            'dev:app',
            'dev:dashboard',
            'dev:ai-scene',
            'dev:docs',
            'dev:scene-webgpu',
            'build:app',
            'build:dashboard',
            'build:ai-scene',
            'build:docs'
          ];

          for (const script of privateScripts) {
            delete packageJson.scripts?.[script];
          }

          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          # Public repositories must not receive this private repository's workflows.
          rm -rf .github

      - name: Verify public snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd public-dist

          private_paths=(
            packages/dashboard
            packages/app-editor
            packages/docs
            packages/core-webgpu
            packages/scene-editor-webgpu
            packages/ai-scene
            packages/core/dashboard.html
            plan
            meteor3d-server/.env
            meteor3d-server/.env.example
            .github
          )

          for path in "${private_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Private path remains in public snapshot: $path" >&2
              exit 1
            fi
          done

          unexpected_markdown="$(find . -type f -name '*.md' ! -path './README.md' -print -quit)"
          if [[ -n "$unexpected_markdown" ]]; then
            echo "Unexpected Markdown file remains: $unexpected_markdown" >&2
            exit 1
          fi

          git_metadata="$(find . -name .git -print -quit)"
          if [[ -n "$git_metadata" ]]; then
            echo 'Private Git history was copied into the public snapshot.' >&2
            exit 1
          fi

      - name: Create independent public history
        shell: bash
        run: |
          set -euo pipefail
          cd public-dist

          git init -b master
          git config user.name 'nikonikoCW'
          git config user.email '84675738@qq.com'
          # The source snapshot only contains tracked files, so keep those files even
          # when they match an ignore rule inherited from the private repository.
          git add -A -f
          git commit -m 'Sync public snapshot'

          if [[ "$(git rev-list --count HEAD)" != '1' ]]; then
            echo 'Public snapshot unexpectedly contains inherited Git history.' >&2
            exit 1
          fi

      - name: Push snapshot to GitHub and Gitee public repos
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd public-dist

          git remote add github-public "https://nikonikoCW:${GITHUB_TOKEN}@github.com/nikonikoCW/Meteor3DEditor.git"
          git remote add gitee-public "https://CWniconico:${GITEE_TOKEN}@gitee.com/CWniconico/Meteor3DEditor.git"

          git push github-public master:master --force
          git push gitee-public master:master --force
