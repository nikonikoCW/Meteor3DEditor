name: Sync to Gitee Private Repo

on:
  push:
    branches: [master]  # 触发条件：当你向主分支 push 时
  workflow_dispatch:      # 允许你在 Github 网页上手动触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 第一步：把本仓库（Github 原有全量代码）拉取下来
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 第二步：直接推送，不经过任何清理！
      - name: Push to Gitee private repo
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_PRIVATE_REPO_TOKEN }}
        run: |
          # 添加你新创建的 Gitee 私有仓库地址为远程遥控节点
          git remote add gitee https://CWniconico:${GITEE_TOKEN}@gitee.com/CWniconico/Meteor3D.git
          echo "正在全量推送未脱敏代码到 Gitee Meteor3D 私有仓库..."
          git push gitee HEAD:master --force
